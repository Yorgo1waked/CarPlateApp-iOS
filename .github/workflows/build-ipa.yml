name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen 2.40.1
        run: |
          curl -L -o /tmp/xcodegen.zip https://github.com/YonasKolb/xcodegen/releases/download/2.40.1/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo cp /tmp/xcodegen/xcodegen /usr/local/bin/
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen

      - name: Build unsigned app bundle
        run: |
          xcodebuild build \
            -project CarPlateApp.xcodeproj \
            -scheme CarPlateApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/CarPlateApp.app" Payload/
          zip -r CarPlateApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarPlateApp-IPA
          path: CarPlateApp.ipa
