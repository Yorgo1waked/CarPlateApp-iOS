name: CarPlateApp
options:
  bundleIdPrefix: com.carplate
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "14.3"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CarPlateApp:
    type: application
    platform: iOS
    sources:
      - CarPlateApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carplate.app
        INFOPLIST_FILE: CarPlateApp/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
